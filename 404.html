<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Page not found · Barusan Hosting</title>
    <meta name="description" content="The page you're looking for doesn't exist or has been moved." />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0B1220;
        --fg: #F5F7FB;
        --muted: #9AA4B2;
        --primary: #2F80ED;
        --accent: #56CCF2;
        --border: rgba(255, 255, 255, 0.1);
        --card: rgba(255, 255, 255, 0.04);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; min-height: 100vh; }
      body {
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-image:
          radial-gradient(ellipse 60% 40% at 20% 0%, rgba(47, 128, 237, 0.18), transparent 60%),
          radial-gradient(ellipse 50% 40% at 85% 5%, rgba(86, 204, 242, 0.14), transparent 60%);
        background-attachment: fixed;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        text-align: center;
        padding: 2.5rem 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        backdrop-filter: blur(14px) saturate(140%);
      }
      .code {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: clamp(4rem, 12vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 0;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p { color: var(--muted); margin: 0 0 1.75rem; font-size: 0.95rem; line-height: 1.55; }
      .actions { display: flex; gap: 0.625rem; justify-content: center; flex-wrap: wrap; }
      a, button {
        font: inherit;
        font-weight: 500;
        padding: 0.65rem 1.25rem;
        border-radius: 0.625rem;
        text-decoration: none;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
      .primary:hover { transform: translateY(-1px); }
      .secondary { background: transparent; color: var(--fg); border-color: var(--border); }
      .secondary:hover { border-color: rgba(255, 255, 255, 0.25); }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <div class="actions">
        <a class="primary" href="/">Go home</a>
        <button class="secondary" type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">Go back</button>
      </div>
    </main>
  </body>
</html>

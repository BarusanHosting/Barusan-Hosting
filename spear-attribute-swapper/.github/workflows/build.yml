name: Build Spear Attribute Swapper

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        working-directory: spear-attribute-swapper
        run: gradle --no-daemon build

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: spear-attribute-swapper-jars
          path: spear-attribute-swapper/build/libs/*.jar
          if-no-files-found: error
